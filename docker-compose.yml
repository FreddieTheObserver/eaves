services:
  postgres:
    image: postgres:16-alpine
    container_name: eaves-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eaves
      POSTGRES_PASSWORD: eaves_password
      POSTGRES_DB: eaves
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: eaves-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
